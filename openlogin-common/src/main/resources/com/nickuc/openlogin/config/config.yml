# GitHub: https://github.com/Earth1283/OpeNLogin

# Do not change this setting
file-version: 1

# Language of the plugin.
# For more information: https://github.com/Earth1283/OpeNLogin/blob/master/docs/lang.md
languageFile: 'messages_en.yml'

# Security system related settings.
Security:
  # Amount of time for a player to log in/register (set in seconds).
  time-to-login: 45

  session:
    # Minutes a returning player may skip re-entering their password when rejoining
    # from the same IP address they last logged in from. Set to 0 to disable.
    timeout-minutes: 0

  password:
    # Small password size.
    small: 5

    # Size for big passwords.
    large: 15

  brute-force:
    # How many wrong passwords a player may enter before being locked out.
    # Set to 0 to disable this protection.
    max-login-attempts: 5

    # How many minutes a lockout lasts (and the window that failed attempts are counted in).
    reset-minutes: 10

    # Maximum number of accounts that may be registered from the same IP address.
    # Set to 0 to disable this limit.
    max-accounts-per-ip: 3

# Storage settings.
Storage:
  # Storage type: SQLITE or MYSQL
  type: 'SQLITE'

  # Only used when type is set to MYSQL.
  MySQL:
    host: 'localhost'
    port: 3306
    database: 'openlogin'
    username: 'root'
    password: ''
    useSSL: false
    pool-size: 10